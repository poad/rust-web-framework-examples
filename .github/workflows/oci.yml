name: Build (OCI)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {project: 'actix-example'}
          - {project: 'axum-example'}
          - {project: 'rocket-example'}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/.buildx-cache
        key: ${{ runner.os }}-buildx-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-buildx-

    - name: Build
      if: github.event_name == 'pull_request' || github.actor == 'dependabot[bot]'
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        push: false
        context: ${{ matrix.config.project }}
        platforms: linux/amd64,linux/arm64
        file: ${{ matrix.config.project }}/Dockerfile
        tags: poad/${{ matrix.config.project }}:latest
